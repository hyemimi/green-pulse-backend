services:
  postgres:
    image: postgres:16-alpine
    container_name: green-pulse-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: green_pulse
      POSTGRES_USER: green_pulse
      POSTGRES_PASSWORD: green_pulse
    ports:
      - "5432:5432"
    volumes:
      - green_pulse_pgdata:/var/lib/postgresql/data
      - ./database/migrations:/docker-entrypoint-initdb.d:ro

volumes:
  green_pulse_pgdata:
